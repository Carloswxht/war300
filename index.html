<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1013;
    --panel:#181B20;
    --panel-2:#1F2329;
    --line:#2B3038;
    --text:#F2F1EC;
    --text-dim:#9AA0AA;
    --day1:#FF8A3D;
    --day1-dim:#3A2A1C;
    --day2:#33D17A;
    --day2-dim:#1B2E22;
    --day3:#4FA3FF;
    --day3-dim:#1C2A3A;
    --extra:#C792EA;
    --extra-dim:#2A2033;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:'Archivo',sans-serif;}
  body{padding:28px 18px 80px;max-width:640px;margin:0 auto;}

  .masthead{margin-bottom:34px;}
  .kicker{font-size:13px;color:var(--text-dim);margin:0 0 10px;letter-spacing:0.5px;}
  h1{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(30px,8vw,42px);
    line-height:1.02;
    margin:0;
    letter-spacing:-0.5px;
  }

  .board{position:relative;}
  .day{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:16px;
    overflow:hidden;
    transition:border-color .2s ease;
  }
  .day[data-accent="1"]{--accent:var(--day1);--accent-dim:var(--day1-dim);}
  .day[data-accent="2"]{--accent:var(--day2);--accent-dim:var(--day2-dim);}
  .day[data-accent="3"]{--accent:var(--day3);--accent-dim:var(--day3-dim);}
  .day[data-accent="4"]{--accent:var(--extra);--accent-dim:var(--extra-dim);}

  .day-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:20px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .day-num{
    font-family:'Archivo Black',sans-serif;
    font-size:34px;
    color:var(--accent);
    line-height:1;
    min-width:38px;
  }
  .day-title{flex:1;}
  .day-title .name{font-size:17px;font-weight:700;margin:0 0 3px;}
  .day-title .desc{font-size:13px;color:var(--text-dim);margin:0;}

  .muscles{padding:10px 14px 16px;display:flex;flex-direction:column;gap:8px;}
  .muscle{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .muscle-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    cursor:pointer;
    user-select:none;
  }
  .muscle-label{flex:1;font-size:15px;font-weight:600;}
  .chevron{
    width:16px;height:16px;flex-shrink:0;color:var(--text-dim);
    transition:transform .2s ease;
  }
  .muscle.open .chevron{transform:rotate(90deg);color:var(--accent);}
  .muscle-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .muscle.open .muscle-body{max-height:600px;}
  .muscle-body-inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:2px;}

  .sub{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 2px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  .sub:last-child{border-bottom:none;}
  .box{
    width:20px;height:20px;min-width:20px;margin-top:1px;
    border-radius:6px;
    border:2px solid var(--line);
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,border-color .15s ease;
  }
  .box svg{opacity:0;transform:scale(.6);transition:opacity .12s ease,transform .12s ease;}
  .sub.on .box{background:var(--accent);border-color:var(--accent);}
  .sub.on .box svg{opacity:1;transform:scale(1);}
  .sub-text{flex:1;}
  .sub-name{font-size:13.5px;font-weight:700;margin:0 0 3px;}
  .sub.on .sub-name{color:var(--text);}
  .sub:not(.on) .sub-name{color:var(--text-dim);}
  .sub-desc{font-size:12.5px;color:var(--text-dim);line-height:1.45;margin:0;font-style:italic;}

  .day4-toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;cursor:pointer;
  }
  .day4-toggle .name{font-size:15px;font-weight:700;color:var(--text);}
  .day4-toggle .hint{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .switch{
    width:44px;height:26px;border-radius:20px;background:var(--panel-2);
    border:1px solid var(--line);position:relative;flex-shrink:0;
    transition:background .15s ease;
  }
  .switch::after{
    content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;
    border-radius:50%;background:var(--text-dim);transition:transform .15s ease,background .15s ease;
  }
  .switch.on{background:var(--accent-dim);border-color:var(--accent);}
  .switch.on::after{transform:translateX(18px);background:var(--accent);}
  .day4-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .day4-body.open{max-height:900px;}

  .note{
    margin:0;
    padding:12px 20px 18px;
    font-size:12.5px;
    line-height:1.5;
    color:var(--text-dim);
    border-top:1px dashed var(--line);
  }

  body{padding-bottom:110px;}

  .continue-mini{
    display:flex;align-items:center;gap:6px;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    padding:8px 6px;
    position:absolute;
    right:14px;top:50%;
    transform:translateY(-50%);
  }
  .continue-mini svg{width:16px;height:16px;}
  .continue-mini:active{opacity:.6;}

  #view-exercises, #view-execution{display:none;}
  .ex-topbar{
    display:flex;align-items:center;gap:12px;
    margin-bottom:24px;
  }
  .back-btn{
    width:36px;height:36px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;color:var(--text);
  }
  .ex-topbar h2{font-size:19px;margin:0;font-family:'Archivo Black',sans-serif;letter-spacing:-0.3px;}
  .ex-group-title{
    font-size:12.5px;color:var(--text-dim);
    letter-spacing:.5px;text-transform:uppercase;
    margin:22px 2px 10px;
  }
  .ex-group-title:first-of-type{margin-top:0;}
  .ex-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
  }
  .ex-card h3{font-size:14.5px;margin:0 0 12px;}
  .ex-option{
    display:flex;align-items:center;gap:12px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .ex-option:last-child{border-bottom:none;}
  .radio{
    width:18px;height:18px;min-width:18px;
    border-radius:50%;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .radio::after{
    content:'';width:9px;height:9px;border-radius:50%;
    background:var(--accent, var(--text));opacity:0;transition:opacity .12s ease;
  }
  .ex-option.picked .radio{border-color:var(--accent, var(--text));}
  .ex-option.picked .radio::after{opacity:1;}
  .ex-option-name{font-size:13.5px;}
  .ex-option.picked .ex-option-name{font-weight:700;}
  .ex-option:not(.picked) .ex-option-name{color:var(--text-dim);}
  .ver-link{
    margin-left:auto;
    font-size:12px;font-weight:700;
    color:var(--accent, var(--text-dim));
    padding:4px 6px;
    flex-shrink:0;
  }
  .ver-link:active{opacity:.5;}

  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    z-index:40;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    width:100%;max-width:640px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:20px 20px 28px;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:6px;
  }
  .modal-head h3{font-size:15px;margin:0;}
  .modal-close{
    width:32px;height:32px;border-radius:10px;
    background:var(--panel-2);border:1px solid var(--line);
    color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .stick-stage{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    margin-top:14px;
    display:flex;align-items:center;justify-content:center;
    padding:10px 0;
  }
  .stick-stage svg{width:150px;height:190px;}
  .stick-stage line, .stick-stage circle{
    stroke:var(--text);
    stroke-width:5;
    stroke-linecap:round;
    fill:none;
  }
  .stick-stage circle.head{fill:var(--text);stroke:none;}
  .stick-stage .floor{stroke:var(--line);stroke-width:3;}

  @keyframes swingUpper  { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(var(--u-to,-80deg));} }
  @keyframes swingFore   { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(var(--f-to,0deg));} }
  @keyframes swingLegU   { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(var(--lu-to,0deg));} }
  @keyframes swingLegL   { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(var(--ll-to,0deg));} }
  @keyframes swingTorso  { 0%,100%{transform:rotate(0deg) translateY(0);} 50%{transform:rotate(var(--t-to,0deg)) translateY(var(--t-ty,0px));} }
  @keyframes swingHeel   { 0%,100%{transform:translateY(0);} 50%{transform:translateY(var(--heel-to,-10px));} }
  @keyframes swaySide    { 0%,100%{transform:translateX(0);} 50%{transform:translateX(var(--sway-to,4px));} }

  #armUpper, #armFore, #legUpper, #legLower, #torsoG, #heelG, #figureG{
    transform-box:fill-box;
    transform-origin:center;
    animation-duration:1.4s;
    animation-iteration-count:infinite;
    animation-timing-function:ease-in-out;
  }
  .anim-play #armUpper{animation-name:swingUpper;}
  .anim-play #armFore{animation-name:swingFore;}
  .anim-play #legUpper{animation-name:swingLegU;}
  .anim-play #legLower{animation-name:swingLegL;}
  .anim-play #torsoG{animation-name:swingTorso;}
  .anim-play #heelG{animation-name:swingHeel;}
  .anim-play #figureG{animation-name:swaySide;}

  .stick-caption{
    margin:14px 2px 0;font-size:12.5px;color:var(--text-dim);line-height:1.5;
  }

  .exec-topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;
  }
  .exec-topbar-left{display:flex;align-items:center;gap:12px;}
  .exec-topbar h2{font-size:19px;margin:0;font-family:'Archivo Black',sans-serif;letter-spacing:-0.3px;}
  .exec-progress{font-size:12.5px;color:var(--text-dim);}

  .exec-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    position:relative;
  }
  .exec-kicker{font-size:12px;color:var(--text-dim);margin:0 0 6px;}
  .exec-name{font-size:20px;font-weight:800;margin:0 0 4px;line-height:1.2;}
  .exec-see{
    font-size:12.5px;font-weight:700;color:var(--accent,var(--text-dim));
    margin:0 0 18px;display:inline-block;cursor:pointer;
  }
  .exec-fields{display:flex;gap:12px;margin-bottom:16px;}
  .exec-field{flex:1;}
  .exec-field label{
    display:block;font-size:11.5px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;
  }
  .exec-field input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:'Archivo',sans-serif;
    font-size:15px;
    font-weight:700;
    padding:11px 12px;
  }
  .exec-badge{
    display:inline-block;
    font-size:11.5px;font-weight:700;
    color:var(--accent,var(--text));
    background:var(--accent-dim,var(--panel-2));
    border-radius:8px;
    padding:5px 10px;
    margin-bottom:14px;
  }
  .exec-note{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin:0 0 4px;font-style:italic;}
  .exec-divider{
    display:flex;align-items:center;gap:10px;
    margin:26px 0 10px;
  }
  .exec-divider::before, .exec-divider::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg, transparent, var(--line) 50%, transparent);
  }
  .exec-divider::before{background:linear-gradient(90deg, transparent, var(--line));}
  .exec-divider::after{background:linear-gradient(90deg, var(--line), transparent);}
  .exec-divider span{
    font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:var(--text-dim);white-space:nowrap;
  }
  .exec-continue{
    width:100%;
    margin-top:6px;
    background:var(--text);
    color:var(--ink);
    border:none;
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:15px 18px;
    border-radius:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .exec-continue svg{width:15px;height:15px;}
  .exec-continue:active{transform:scale(.97);}
  .exec-done{
    text-align:center;padding:60px 20px;
  }
  .exec-done h2{font-family:'Archivo Black',sans-serif;font-size:24px;margin:0 0 8px;}
  .exec-done p{color:var(--text-dim);font-size:13.5px;margin:0;}

  .bottom-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    height:64px;
    background:var(--panel);
    border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    padding:0 14px;
    z-index:15;
  }
  .hamburger{
    width:46px;height:46px;
    border-radius:12px;
    background:transparent;
    border:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;
    cursor:pointer;
  }
  .hamburger span{
    display:block;
    width:22px;height:2px;
    background:var(--text);
    border-radius:2px;
  }
  .hamburger:active{opacity:.6;}

  .toast{
    position:fixed;
    left:50%;bottom:82px;
    transform:translateX(-50%) translateY(10px);
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:12.5px;
    padding:10px 16px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:25;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

  <div class="masthead">
    <p class="kicker">War300</p>
    <h1>Tu semana de entreno.</h1>
  </div>

  <div id="view-checklist">
    <div class="board" id="board"></div>
  </div>

  <div id="view-exercises">
    <div class="ex-topbar">
      <button class="back-btn" id="backBtn" aria-label="Volver">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2>Elige tu ejercicio</h2>
    </div>
    <div id="exBoard"></div>
  </div>

  <div id="view-execution">
    <div class="exec-topbar">
      <div class="exec-topbar-left">
        <button class="back-btn" id="execBackBtn" aria-label="Volver">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2>Tu entreno</h2>
      </div>
      <div class="exec-progress" id="execProgress"></div>
    </div>
    <div id="execCard"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 id="modalTitle">Ejercicio</h3>
        <button class="modal-close" id="modalClose" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="stick-stage">
        <svg viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg">
          <line class="floor" x1="30" y1="200" x2="170" y2="200"/>
          <g id="figureG">
            <g id="torsoG">
              <line x1="100" y1="60" x2="100" y2="120"/>
              <circle class="head" cx="100" cy="42" r="14"/>
            </g>
            <g id="legUpper" style="transform-origin:100px 120px;">
              <line x1="100" y1="120" x2="100" y2="160"/>
              <g id="legLower" style="transform-origin:100px 160px;">
                <line x1="100" y1="160" x2="100" y2="198"/>
              </g>
            </g>
            <g id="armUpper" style="transform-origin:100px 62px;">
              <line x1="100" y1="62" x2="118" y2="95"/>
              <g id="armFore" style="transform-origin:118px 95px;">
                <line x1="118" y1="95" x2="118" y2="128"/>
              </g>
            </g>
            <g id="heelG" style="transform-origin:100px 198px;"></g>
          </g>
        </svg>
      </div>
      <p class="stick-caption" id="modalCaption">Silueta esquemática del movimiento — sirve para recordar la forma del ejercicio, no como guía de técnica detallada.</p>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="hamburger" id="menuBtn" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <button class="continue-mini" id="continueBtn">
      Continuar
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <p class="toast" id="status"></p>

<script>
const chevronSvg = `<svg class="chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const checkSvg = `<svg width="12" height="9" viewBox="0 0 13 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 5L4.5 8.5L12 1" stroke="#0E1013" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// Orden: músculos y sub-músculos van de mayor a menor peso estético
const DAYS = [
  {
    id:'day1', accent:1, num:'01',
    name:'Empuje superior',
    desc:'Hombro · pecho · tríceps',
    muscles:[
      { name:'Hombro', subs:[
        { name:'Lateral', desc:'El que más ancho hace ver el hombro, clave para el V-taper (cintura chica, hombro ancho).' },
        { name:'Posterior', desc:'Poco entrenado por la mayoría, pero da esa forma redonda al ver el hombro de perfil o de espalda.' },
        { name:'Anterior', desc:'Se trabaja solo con el press de pecho, no necesita mucho foco extra.' },
      ]},
      { name:'Pecho', subs:[
        { name:'Superior (clavicular)', desc:'El que más cierra el look, da esa línea recta arriba de la camisa.' },
        { name:'Medio (esternal)', desc:'Da el grosor y el volumen general del pecho.' },
      ]},
      { name:'Tríceps', subs:[
        { name:'Cabeza larga', desc:'La que más volumen total le da al brazo — es la más grande de las tres.' },
        { name:'Cabeza lateral', desc:'Da el pico que se ve desde afuera del brazo.' },
        { name:'Cabeza medial / ancóneo', desc:'Cierra la forma hacia el codo — hace que el brazo se vea completo hasta el final.' },
      ]},
    ]
  },
  {
    id:'day2', accent:2, num:'02',
    name:'Pierna y core',
    desc:'Abdomen · cuádriceps · glúteo · gemelo',
    muscles:[
      { name:'Abdomen', subs:[
        { name:'Recto superior', desc:'El más visible, el six-pack que se marca primero.' },
        { name:'Oblicuos (línea en V)', desc:'Dan la línea en V que baja hacia la cadera — la línea de Adonis, de las zonas más asociadas a cuerpo definido.' },
        { name:'Recto inferior', desc:'El más difícil de marcar, el último en aparecer.' },
      ]},
      { name:'Cuádriceps', subs:[
        { name:'Vasto lateral ("la gota")', desc:'La gota justo arriba de la rodilla, uno de los detalles más asociados a piernas trabajadas en hombres.' },
        { name:'General', desc:'La base de fuerza de toda la pierna — sin esto, el resto no tiene dónde apoyarse.' },
      ]},
      { name:'Glúteo', subs:[
        { name:'General', desc:'Da forma a la parte trasera y ayuda a la proporción cintura-cadera.' },
      ]},
      { name:'Gemelo', subs:[

function exCard(sub, accentIdx){
  const opts = exercisesFor(sub.muscleName, sub.name);
  if(opts.length === 0) return '';
  const picked = chosenExercise[sub.id] || opts[0];
  return `
    <div class="ex-card" data-accent="${accentIdx}">
      <h3>${sub.muscleName} — ${sub.name}</h3>
      ${opts.map(ex => exOptionRow(sub.id, ex, ex === picked)).join('')}
    </div>`;

function renderExercisesView(){
  const checkedSubs = board.querySelectorAll('.sub.on');
  if(checkedSubs.length === 0){
    showToast('Marca al menos un sub-músculo primero.');
    return false;
  }
  let html = '';
  let lastDay = null;
  checkedSubs.forEach(el=>{
    const sub = SUB_INDEX[el.dataset.sub];
    if(!sub) return;
    const dayObj = [...DAYS, DAY4].find(d=>d.name === sub.dayName);
    const accentIdx = dayObj ? dayObj.accent : 1;
    if(sub.dayName !== lastDay){
      html += `<p class="ex-group-title">${sub.dayName}</p>`;
      lastDay = sub.dayName;
    }
    html += exCard(sub, accentIdx);
    if(!chosenExercise[sub.id]){
      const opts = exercisesFor(sub.muscleName, sub.name);
      if(opts.length) chosenExercise[sub.id] = opts[0];
    }
  });
  exBoard.innerHTML = html;

  exBoard.querySelectorAll('.ex-card').forEach(card=>{
    const accent = card.dataset.accent;
    card.style.setProperty('--accent', accent === '1' ? 'var(--day1)' : accent === '2' ? 'var(--day2)' : accent === '3' ? 'var(--day3)' : 'var(--extra)');
  });

  exBoard.querySelectorAll('.ex-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const subId = opt.dataset.sub;
      const card = opt.closest('.ex-card');
      card.querySelectorAll('.ex-option').forEach(o=> o.classList.remove('picked'));
      opt.classList.add('picked');
      chosenExercise[subId] = opt.dataset.ex;
      autosave();
    });
  });

  exBoard.querySelectorAll('.ver-link').forEach(link=>{
    link.addEventListener('click', (e)=>{
      e.stopPropagation();
      openAnimModal(link.dataset.ver);
    });
  });
  return true;
}

const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalCaption = document.getElementById('modalCaption');
const figureG = document.getElementById('figureG');
const ALL_VARS = ['--u-to','--f-to','--lu-to','--ll-to','--t-to','--t-ty','--heel-to','--sway-to'];

function openAnimModal(exName){
  const patternKey = EXERCISE_PATTERN[exName] || 'curl';
  const pattern = PATTERNS[patternKey] || PATTERNS['curl'];
  modalTitle.textContent = exName;
  modalCaption.textContent = `Movimiento: ${pattern.label}. Silueta esquemática — sirve para recordar la forma del ejercicio, no como guía de técnica detallada.`;

  ALL_VARS.forEach(v => figureG.style.removeProperty(v));
  Object.entries(pattern.vars || {}).forEach(([k,val]) => figureG.style.setProperty(k, val));

  figureG.classList.remove('anim-play');
  void figureG.offsetWidth; // reinicia la animación
  figureG.classList.add('anim-play');

  modalOverlay.classList.add('open');
}

function closeAnimModal(){
  modalOverlay.classList.remove('open');
  figureG.classList.remove('anim-play');
}

document.getElementById('modalClose').addEventListener('click', closeAnimModal);
modalOverlay.addEventListener('click', (e)=>{
  if(e.target === modalOverlay) closeAnimModal();
});

      if(e.target.classList.contains('ver-link')) return;
      const newEx = opt.dataset.ex;
      if(newEx === item.exName) return;
      chosenExercise[item.subId] = newEx;
      execList[execIndex].exName = newEx;
      autosave();
      renderExecCard();
    });
  });

  execCard.querySelectorAll('.ver-link').forEach(link=>{
    link.addEventListener('click', (e)=>{
      e.stopPropagation();
      openAnimModal(link.dataset.ver);
    });
  });

  document.getElementById('execSeeLink').addEventListener('click', ()=> openAnimModal(item.exName));
}

// ---- Navegación entre las 3 pantallas ----
let currentView = 'checklist';

function goToExercises(){
  const ok = renderExercisesView();
  if(!ok) return;
  viewChecklist.style.display = 'none';
  viewExercises.style.display = 'block';
  currentView = 'exercises';
  continueBtn.textContent = '';
  continueBtn.innerHTML = `Iniciar <svg viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  window.scrollTo(0,0);
}

function goToExecution(){
  buildExecList();
  if(execList.length === 0){
    showToast('Elige al menos un ejercicio primero.');
    return;
  }
  execIndex = 0;
  renderExecCard();
  viewExercises.style.display = 'none';
  viewExecution.style.display = 'block';
  currentView = 'execution';
  window.scrollTo(0,0);
}

continueBtn.addEventListener('click', ()=>{
  if(currentView === 'checklist') goToExercises();
  else if(currentView === 'exercises') goToExecution();
  else if(currentView === 'execution'){
    execIndex++;
    renderExecCard();
    window.scrollTo(0,0);
  }
});

document.getElementById('backBtn').addEventListener('click', ()=>{
  viewExercises.style.display = 'none';
  viewChecklist.style.display = 'block';
  currentView = 'checklist';
  continueBtn.style.visibility = 'visible';
  continueBtn.innerHTML = `Continuar <svg viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  window.scrollTo(0,0);
});

document.getElementById('execBackBtn').addEventListener('click', ()=>{
  viewExecution.style.display = 'none';
  viewExercises.style.display = 'block';
  currentView = 'exercises';
  continueBtn.style.visibility = 'visible';
  continueBtn.innerHTML = `Iniciar <svg viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  window.scrollTo(0,0);
});

const statusEl = document.getElementById('status');
let toastTimer = null;
function showToast(msg){
  statusEl.textContent = msg;
  statusEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> statusEl.classList.remove('show'), 2200);
}

const workData = {}; // subId -> { peso, reps }

function buildStateObj(){
  const checked = {};
  board.querySelectorAll('.sub').forEach(el=>{
    checked[el.dataset.sub] = el.classList.contains('on');
  });
  return { checked, exercises: chosenExercise, work: workData, savedAt: new Date().toISOString() };
}

async function persistState(silent){
  const cfg = buildStateObj();
  try{
    const result = await window.storage.set('rutina-checklist', JSON.stringify(cfg), false);
    if(!silent) showToast(result ? 'Progreso guardado.' : 'No se pudo guardar, inténtalo de nuevo.');
    else if(result) showToast('Guardado ✓');
  }catch(e){
    if(!silent) showToast('No se pudo guardar, inténtalo de nuevo.');
  }
}

let autosaveTimer = null;
function autosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=> persistState(true), 500);
}

async function loadState(){
  try{
    const res = await window.storage.get('rutina-checklist', false);
    if(res && res.value){
      const cfg = JSON.parse(res.value);
      Object.entries(cfg.checked || {}).forEach(([id, on])=>{
        if(on){
          const row = board.querySelector(`.sub[data-sub="${id}"]`);
          if(row) row.classList.add('on');
        }
      });
      Object.entries(cfg.exercises || {}).forEach(([id, ex])=>{
        chosenExercise[id] = ex;
      });
      Object.entries(cfg.work || {}).forEach(([id, w])=>{
        workData[id] = w;
      });
    }
  }catch(e){
    // sin progreso guardado todavía
  }
}


document.getElementById('menuBtn').addEventListener('click', ()=>{
  showToast('Menú próximamente.');
});

loadState();
</script>
